{{- $issuer := .Values.giantSwarmClusterIssuer | default dict -}}
{{- $gatewaySolver := dig "acme" "http01" "gatewayHTTPRoute" "enabled" false $issuer -}}
{{- $certManager := index .Values "cert-manager" | default dict -}}
{{- $gatewayAPI := dig "config" "enableGatewayAPI" false $certManager -}}
{{- if and $gatewaySolver (not $gatewayAPI) -}}
{{- fail "giantSwarmClusterIssuer.acme.http01.gatewayHTTPRoute.enabled requires cert-manager.config.enableGatewayAPI: true, otherwise the HTTP-01 challenges never complete." -}}
{{- end -}}
{{- if ne nil (dig "acme" "http01" "ingressClassName" nil $issuer) -}}
{{- fail "giantSwarmClusterIssuer.acme.http01.ingressClassName was removed. The Ingress HTTP-01 solver is replaced by acme.http01.gatewayHTTPRoute.parentRefs (Gateway API)." -}}
{{- end -}}
{{- if ne nil (dig "acme" "http01" "enabled" nil $issuer) -}}
{{- fail "giantSwarmClusterIssuer.acme.http01.enabled was removed. Use acme.http01.gatewayHTTPRoute.enabled instead." -}}
{{- end -}}
